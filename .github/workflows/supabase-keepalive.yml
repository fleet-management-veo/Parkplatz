# FleetPark · hält das kostenlose Supabase-Projekt wach (verhindert 7-Tage-Pause)
# Zielpfad im Repo:  .github/workflows/supabase-keepalive.yml
name: Supabase wachhalten

on:
  schedule:
    - cron: "0 6 * * *"     # täglich 06:00 UTC (ca. 07:00/08:00 DE) – reichlich Puffer zu 7 Tagen
  workflow_dispatch: {}       # zusätzlich manuell auslösbar (Actions-Tab -> Run workflow)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anpingen
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://lggbpwthsaakaxnvpkmy.supabase.co/rest/v1/fleet?select=id&limit=1" \
            -H "apikey: sb_publishable_YXhN54anFg6dxjAABbLizg_tfh6viJW")
          echo "Antwort: HTTP $code"
          test "$code" = "200"   # schlägt fehl (roter Haken), falls Supabase nicht antwortet -> Frühwarnung
